services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tterm_web
      POSTGRES_USER: tterm_web
      POSTGRES_PASSWORD: tterm_pi_secure_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 80M
    command: >
      postgres
      -c shared_buffers=16MB
      -c work_mem=2MB
      -c max_connections=20

  tterm:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      TTERM_DATABASE_URL: postgresql://tterm_web:tterm_pi_secure_password@db:5432/tterm_web
      TTERM_PAGE_HOST: "0.0.0.0"
      TTERM_CONNECT_HOST: "0.0.0.0"
      TTERM_PAGE_PORT: 8290
      TTERM_CONNECT_PORT: 8291
      TTERM_PAGE_URL: ${TTERM_PAGE_URL:-https://tterm.e-klimov.ru}
      TTERM_CONNECT_URL: ${TTERM_CONNECT_URL:-https://tterm.e-klimov.ru}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      TTERM_ALLOWED_HOSTS: ${TTERM_ALLOWED_HOSTS:-*}
      TTERM_OWNER_EMAIL: ${TTERM_OWNER_EMAIL:-eklimov84@gmail.com}
      TTERM_OWNER_NAME: ${TTERM_OWNER_NAME:-Евгений}
      TTERM_WEB_DIST: web/dist
      TTERM_TELEGRAM_BOT_TOKEN: ${TTERM_TELEGRAM_BOT_TOKEN:-9021265541:AAHZYpinnQE60ptrlL3INGvj4g-4oMY0AzY}
      TTERM_TELEGRAM_CHAT_ID: ${TTERM_TELEGRAM_CHAT_ID:-55570186}
      TTERM_RESEND_KEY: ${TTERM_RESEND_KEY:-}
      TTERM_BREVO_KEY: ${TTERM_BREVO_KEY:-}
      TTERM_SMTP_HOST: ${TTERM_SMTP_HOST:-${SMTP_HOST:-smtp.beget.com}}
      TTERM_SMTP_PORT: ${TTERM_SMTP_PORT:-${SMTP_PORT:-2525}}
      TTERM_SMTP_USER: ${TTERM_SMTP_USER:-${SMTP_USER:-klimov@e-klimov.ru}}
      TTERM_SMTP_PASSWORD: ${TTERM_SMTP_PASSWORD:-${SMTP_PASSWORD:-17Ry5912@_}}
      TTERM_SMTP_SSL: ${TTERM_SMTP_SSL:-${SMTP_SSL:-false}}
      TTERM_MAIL_FROM: ${TTERM_MAIL_FROM:-tTerm <klimov@e-klimov.ru>}
    ports:
      - "8290:8290"
      - "8291:8291"
    volumes:
      - signerdata:/app/data/signer
      - ./tterm:/app/tterm
      - ./web/dist:/app/web/dist
    deploy:
      resources:
        limits:
          memory: 350M

volumes:
  pgdata:
  signerdata:
