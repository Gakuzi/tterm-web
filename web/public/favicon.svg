<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <circle cx="256" cy="256" r="256" fill="#1A1A1A"/>
  <!-- Terminal window outline -->
  <rect x="130" y="140" width="252" height="232" rx="36" fill="none" stroke="#E09F3E" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top bar dots -->
  <circle cx="168" cy="172" r="8" fill="#F4F1EA"/>
  <circle cx="192" cy="172" r="8" fill="#E09F3E"/>
  <circle cx="216" cy="172" r="8" fill="#E09F3E"/>
  <!-- Divider line -->
  <line x1="130" y1="194" x2="382" y2="194" stroke="#E09F3E" stroke-width="12"/>
  <!-- 't' crossing left border -->
  <path d="M106 270 L156 270 M132 236 L132 296 C132 312 142 320 158 320" fill="none" stroke="#E09F3E" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- '>' prompt in white/ivory -->
